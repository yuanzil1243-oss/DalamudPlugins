name: Build Dalamud plugin

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install Dalamud development libraries
        shell: pwsh
        run: |
          Invoke-WebRequest https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive -Force dalamud.zip "$env:APPDATA\XIVLauncher\addon\Hooks\dev"
      - name: Build
        run: |
          dotnet build .\幻想\直暴播报\CritChat.csproj --configuration Release
          dotnet build .\幻想\PoseKit\PoseKit.csproj --configuration Release
      - name: Package plugin files
        shell: pwsh
        run: |
          Compress-Archive -Path .\幻想\直暴播报\bin\Release\CritChat\* -DestinationPath CritChat.zip -Force
          Copy-Item .\幻想\PoseKit\bin\Release\PoseKit\latest.zip PoseKit.zip -Force
      - name: Store plugin archive
        uses: actions/upload-artifact@v4
        with:
          name: plugins-${{ github.ref_name }}
          path: |
            CritChat.zip
            PoseKit.zip
          if-no-files-found: error
          retention-days: 7

