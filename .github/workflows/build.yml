name: Build Dalamud plugin

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install Dalamud development libraries
        shell: pwsh
        run: |
          Invoke-WebRequest https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive -Force dalamud.zip "$env:APPDATA\XIVLauncher\addon\Hooks\dev"
      - name: Build
        run: |
          dotnet build .\幻想\副本标记前置\副本标记前置.csproj --configuration Release
      - name: Package plugin files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\dist | Out-Null
          $dll = Get-ChildItem -Path . -Recurse -Filter RaidMarkerPrerequisite.dll | Select-Object -First 1
          if ($null -eq $dll) { throw "RaidMarkerPrerequisite.dll build output was not found" }
          $packageDir = $dll.Directory.FullName
          Write-Host "Packaging $packageDir"
          Compress-Archive -Path "$packageDir\*" -DestinationPath .\dist\RaidMarkerPrerequisite.zip -Force
      - name: Store plugin archive
        uses: actions/upload-artifact@v4
        with:
          name: plugins-${{ github.ref_name }}
          path: |
            dist/RaidMarkerPrerequisite.zip
          if-no-files-found: error
          retention-days: 7

      - name: Publish direct plugin archive
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/RaidMarkerPrerequisite.zip
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Publish RaidMarkerPrerequisite plugin archive"
          git push

